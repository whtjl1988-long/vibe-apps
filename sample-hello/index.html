<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财富密码生成器</title>
<meta property="og:title" content="财富密码生成器">
<meta property="og:description" content="一点就发财（并不会）。扫码即玩。">
<meta property="og:image" content="https://vibe-all.com/og-card-square.webp">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 这个软件的 body 是 flex 垂直居中，sticky 粘不住顶，用 fixed + body 让位 */
  #site-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; gap: 20px;
    height: 48px; padding: 0 20px; width: 100%;
    background: #0b0b0b; border-bottom: 1px solid #ffffff14;
    font-family: ui-monospace, monospace;
  }
  #site-bar .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: #f4f3f1; }
  #site-bar .brand img { display: block; width: 24px; height: 24px; }
  #site-bar .brand span { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  #site-bar #back-link {
    font-size: 12px; letter-spacing: 0.1em; text-decoration: none; color: #f4f3f199;
    padding: 6px 0; border-bottom: 1px solid transparent;
  }
  #site-bar #back-link:hover { color: #f4f3f1; border-bottom-color: #c7ff3d; }
  #site-bar #share-btn {
    margin-left: auto; font-family: inherit; font-size: 12px; letter-spacing: 0.1em; line-height: 1;
    padding: 8px 14px; border-radius: 9px; cursor: pointer;
    background: transparent; color: #f4f3f199; border: 1px solid #ffffff14;
  }
  #site-bar #share-btn:hover { background: #c7ff3d; color: #0b0b0b; border-color: #c7ff3d; }

  body {
    min-height: 100vh;
    padding-top: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: #0b0b0b;
    color: #f4f3f1;
    font-family: ui-sans-serif, system-ui, sans-serif;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: clamp(28px, 6vw, 48px); letter-spacing: -0.03em; }
  .sub { color: #f4f3f199; max-width: 32em; line-height: 1.6; }
  button {
    font-size: 18px;
    padding: 14px 32px;
    border: none;
    border-radius: 9px;
    background: #c7ff3d;
    color: #0b0b0b;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #fff; }
  #fortune {
    min-height: 3em;
    font-size: 20px;
    color: #c7ff3d;
    max-width: 28em;
    line-height: 1.6;
  }
  .qr { margin-top: 16px; opacity: 0.8; }
  #share-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(11,11,11,0.85);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    z-index: 50; padding: 24px;
  }
  #share-overlay.open { display: flex; }
  #share-overlay img { width: 200px; height: 200px; border-radius: 9px; background: #f4f3f1; padding: 8px; }
  #share-overlay p { font-size: 13px; color: #f4f3f1b8; }
  #share-overlay button {
    font-size: 12px; padding: 6px 14px; background: transparent;
    color: #f4f3f199; border: 1px solid #ffffff14; border-radius: 9px; cursor: pointer;
  }

  .qr img { width: 96px; height: 96px; border-radius: 9px; }
  .qr p { font-size: 12px; color: #f4f3f14d; margin-top: 6px; }
</style>
</head>
<body>
  <nav id="site-bar">
    <a class="brand" href="https://vibe-all.com/">
      <img src="./logo-mushroom.webp" alt="vibe everyting 蘑菇 logo" width="24" height="24">
      <span>Vibe everyting</span>
    </a>
    <a id="back-link" href="https://vibe-all.com/apps/">作品墙</a>
    <button id="share-btn" type="button">分享</button>
  </nav>
  <h1>财富密码生成器</h1>
  <p class="sub">找到了这里，你就找到了财富的密码。点击下方按钮，立刻发财。</p>
  <button id="fortune-btn">点我发财</button>
  <p id="fortune">（财富尚未生成）</p>
  <div id="share-overlay">
    <img src="qr.png" alt="扫码打开">
    <p id="share-tip">链接已复制，扫码继续玩</p>
    <button id="share-close">关闭</button>
  </div>
  <div class="qr">
    <img src="qr.png" alt="扫码即玩">
    <p>扫码，把财富分享给朋友</p>
  </div>
<script>
  const fortunes = [
    "恭喜你！你的财富正在另一个平行宇宙稳定增长。",
    "根据测算，你离财富自由只差 10 的 38 次方 元。",
    "今日宜：做梦。今日忌：醒。",
    "财富密码已生成：123456。已被 800 万人使用。",
    "投资大师说过：你不理财，财不离你。",
    "你的财运被蘑菇吃了。建议再来一次。",
    "警报：检测到你是潜力股，可惜一直没有上市。",
    "发财进度：0.0000001%。请继续保持。"
  ];
  const shareBtn = document.getElementById("share-btn");
  const overlay = document.getElementById("share-overlay");
  const shareTip = document.getElementById("share-tip");
  document.getElementById("share-close").addEventListener("click", () => overlay.classList.remove("open"));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });
  shareBtn.addEventListener("click", async () => {
    if (navigator.share) {
      try { await navigator.share({ title: document.title, url: location.href }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(location.href); shareTip.textContent = "链接已复制，扫码继续玩"; }
    catch (e) { shareTip.textContent = "扫码继续玩"; }
    overlay.classList.add("open");
  });
  document.getElementById("fortune-btn").addEventListener("click", () => {
    const el = document.getElementById("fortune");
    el.textContent = fortunes[Math.floor(Math.random() * fortunes.length)];
  });
</script>
</body>
</html>
