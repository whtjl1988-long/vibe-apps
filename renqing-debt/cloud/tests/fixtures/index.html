<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试固定页</title>
</head>
<body>
<!--
  登录墙与会话的 e2e 用这一页，不用 public/。

  public/ 是**部署内容**——粉丝会把它换成自己的页面（README 第 2 步就是这么教的）。
  测试要是断言 public/ 里的文案，粉丝一换就红 2 条，还会以为是自己部署错了。
  测试装置和部署内容得分开。
-->
<h1>登录墙已经立起来了</h1>
<p>你看到这一页，说明这道墙拦得住也放得进。</p>
</body>
</html>
