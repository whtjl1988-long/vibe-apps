<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>部署成功</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.7 ui-sans-serif, system-ui, sans-serif;
    padding: 24px;
  }
  main { max-width: 34em; }
  h1 { font-size: 1.5rem; margin: 0 0 .5em; }
  code { font-family: ui-monospace, monospace; font-size: .9em; }
  ol { padding-left: 1.4em; }
  li { margin: .4em 0; }
  .muted { opacity: .7; font-size: .9em; }
</style>
</head>
<body>
<main>
  <h1>登录墙已经立起来了</h1>
  <p>你看到这一页，说明 Worker 跑通了，而且你刚才是<strong>过了登录才进来的</strong>——没有凭据的人到不了这里。</p>
  <p>接下来把你自己的东西放上去：</p>
  <ol>
    <li>把要跑的静态页（比如人情债的 <code>index.html</code>）放进 <code>public/</code></li>
    <li><code>npx wrangler deploy</code></li>
  </ol>
  <p class="muted">这一页是模板自带的占位页，替换掉它就行。</p>
</main>
</body>
</html>
